<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />

    <title>Limberg Mamani | Software Engineer & Web Developer</title>
    <meta
      name="description"
      content="Portafolio profesional de Limberg Mamani, desarrollador de software especializado en desarrollo web, frontend, backend, APIs y bases de datos."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Limberg Mamani | Software Engineer & Web Developer" />
    <meta
      property="og:description"
      content="Portafolio profesional de Limberg Mamani, desarrollador de software especializado en desarrollo web, frontend, backend, APIs y bases de datos."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <!--
      Formulario estático oculto para que Netlify pueda detectar el formulario
      "contact" en tiempo de build, ya que la app es una SPA renderizada por JS.
      Debe coincidir en "name" y campos con el formulario real en ContactSection.vue.
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
